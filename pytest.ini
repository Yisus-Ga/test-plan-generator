[pytest]
# Configuración de pytest para el proyecto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Para tests asíncronos (Semana 2-3)
asyncio_mode = auto
# Mostrar nombres de tests al ejecutar
addopts = -v
filterwarnings =
    ignore::DeprecationWarning
